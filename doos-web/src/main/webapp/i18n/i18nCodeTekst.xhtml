<ui:composition
     xmlns="http://www.w3.org/1999/xhtml"
   xmlns:d="http://java.debooy.eu/jsf/facelets"
   xmlns:f="http://xmlns.jcp.org/jsf/core"
   xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  template="/WEB-INF/templates/template.xhtml">
  <ui:define name="body">
    <div class="columns is-centered content">
      <div class="column is-10">
        <h:form id="formI18nCodeTekst">
          <d:titel titel="#{doosI18nCode.detailSubTitel}" />

          <div class="columns is-centered">
            <div class="column">
              <div class="field is-horizontal">
                <d:label label="#{i18nTeksten.tekst('label.taal')}" />
                <div class="field-body is-normal">
                  <d:listbox id="taalKode" value="#{doosI18nCode.i18nCodeTekst.taalKode}" items="#{doosRemote.talenIso6391}" textvalue="#{doosRemote.taalIso6391(doosI18nCode.i18nCodeTekst.taalKode)}" readonly="#{!doosI18nCode.detailAktie.nieuw}" fullwidth="true" />
                </div>
              </div>
              <div class="field is-horizontal">
                <d:label label="#{i18nTeksten.tekst('label.opmerking')}" />
                <div class="field-body is-normal">
                  <d:inputTextarea id="tekst" value="#{doosI18nCode.i18nCodeTekst.tekst}" readonly="#{doosI18nCode.detailAktie.readonly}" />
                </div>
              </div>

              <d:crudbuttonbar bean="#{doosI18nCode}" form="formI18nCodeTekst" detail="detail" returnto="#{doos.path}/i18n/i18nCode.xhtml" />
            </div>
          </div>
        </h:form>
      </div>
    </div>
  </ui:define>
  <ui:define name="modal">
    <d:confirmatie titel="#{i18nTeksten.tekst('doos.titel.i18nCodeTekst.delete')}" />
  </ui:define>
</ui:composition>
