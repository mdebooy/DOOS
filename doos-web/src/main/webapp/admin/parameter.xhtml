<ui:composition
     xmlns="http://www.w3.org/1999/xhtml"
   xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
   xmlns:d="http://java.debooy.eu/jsf/facelets"
   xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  template="/WEB-INF/templates/template.xhtml">
  <ui:define name="body">
    <div class="columns is-centered content">
      <div class="column is-10">
        <h:form id="formParameter">
          <d:titel titel="#{appParam.subTitel}" />

          <div class="columns is-centered">
            <div class="column">
              <div class="field is-horizontal">
                <d:label label="#{i18nTeksten.tekst(appParam.parameter)}" />
                <div class="field-body is-normal">
                  <d:inputText id="waarde" value="#{appParam.waarde}" required="true" maxlength="255" size="100" />
                </div>
              </div>

              <div class="field is-grouped">
                <c:if test="${doos.administrator}">
                  <p class="control">
                    <h:commandLink id="save" action="#{appParam.save}" styleClass="button is-primary is-small">#{i18nTeksten.tekst('button.save')}</h:commandLink>
                  </p>
                </c:if>
                <p class="control">
                  <d:cancel returnto="#{doos.path}/admin/parameters.xhtml" aktie="${appParam.aktie}"/>
                </p>
              </div>
            </div>
          </div>
        </h:form>
      </div>
    </div>
  </ui:define>
</ui:composition>
