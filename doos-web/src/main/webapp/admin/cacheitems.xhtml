<ui:composition
     xmlns="http://www.w3.org/1999/xhtml"
   xmlns:d="http://java.debooy.eu/jsf/facelets"
   xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  template="/WEB-INF/templates/template.xhtml">
  <ui:define name="head">
    <script type="text/javascript" charset="utf-8">
      $(document).ready(function() {
        $('#cacheTabel').DataTable( {
          ajax: { url: '/doos/doosCache',
                  dataSrc: '' },
           order: [[0, 'asc']],
          pagingType: 'full_numbers',
          pageLength: #{properties.appValue('doos.pagelength')},
          lengthChange: false,
          stateSave: true,
          language: {
            paginate: {
              first: '#{properties.appValue('doos.pager.first')}',
              last: '#{properties.appValue('doos.pager.last')}',
              next: '#{properties.appValue('doos.pager.next')}',
              previous: '#{properties.appValue('doos.pager.previous')}'
            },
            search: '#{i18nTeksten.tekst('pager.search')}',
            zeroRecords: '#{i18nTeksten.tekst('pager.zero.records')}',
            info: '#{i18nTeksten.tekst('pager.info')}',
            infoEmpty: '#{i18nTeksten.tekst('pager.info.empty')}',
            infoFiltered: '#{i18nTeksten.tekst('pager.info.filtered')}'
          },
          columns: [
            { data: 'sleutel', title: '#{i18nTeksten.tekst('label.sleutel')}' },
            { data: null, title: '#{i18nTeksten.tekst('label.waarde')}', render: function ( data, type, row ) {
                if (data.hasOwnProperty('waarde')) {
                  return data.waarde;
                }
                return '';
              }
            }
          ]
        } );
      } );
    </script>
  </ui:define>
  <ui:define name="body">
    <div class="columns is-centered content">
      <div class="column is-10">
        <h:form id="formCacheitems">
          <d:titel titel="#{i18nTeksten.tekst(doosCache.subTitel)}" />

          <table id="cacheTabel" class="table is-striped is-narrow is-hoverable" aria-describedby="cacheTabel" />

          <d:cancel returnto="#{doos.path}/admin/cache.xhtml" aktie="#{doosCache.aktie}"/>
        </h:form>
      </div>
    </div>
  </ui:define>
</ui:composition>
